<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta http-equiv="refresh" content="30"/>
    <title>Plex HTTPD</title>
    <script>
        try {
            var stored = localStorage.getItem('plex-httpd-theme');
            var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
            if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..700&display=swap" rel="stylesheet"/>
    <style>
        :root {
            color-scheme: light;
            --background: oklch(1 0 0);
            --foreground: oklch(0.145 0 0);
            --muted-foreground: oklch(0.556 0 0);
            --border: oklch(0.922 0 0);
            --dot: oklch(0.145 0 0 / 0.05);
            --glow: oklch(0.505 0.265 264 / 0.12);
        }

        .dark {
            color-scheme: dark;
            --background: oklch(0.145 0 0);
            --foreground: oklch(0.985 0 0);
            --muted-foreground: oklch(0.708 0 0);
            --border: oklch(1 0 0 / 10%);
            --dot: oklch(0.985 0 0 / 0.05);
            --glow: oklch(0.57 0.235 264 / 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            background: var(--background);
            color: var(--foreground);
            font-family: 'Figtree', 'Figtree Variable', system-ui, sans-serif;
            font-feature-settings: "cv11", "ss01";
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image: radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 0);
            background-size: 28px 28px;
            mask-image: linear-gradient(to bottom, black 0%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 0%, transparent 100%);
        }

        body::after {
            content: "";
            position: fixed;
            inset-inline: 0;
            bottom: 0;
            z-index: 0;
            height: 45vh;
            pointer-events: none;
            background: linear-gradient(to top, var(--glow), transparent);
        }

        .page {
            position: relative;
            z-index: 1;
            display: flex;
            min-height: 100vh;
            min-height: 100dvh;
            flex-direction: column;
        }

        header {
            border-bottom: 1px solid color-mix(in oklab, var(--border) 60%, transparent);
        }

        .header-inner {
            margin: 0 auto;
            display: flex;
            height: 3.5rem;
            max-width: 80rem;
            align-items: center;
            gap: 0.625rem;
            padding: 0 1rem;
        }

        .header-inner img {
            width: 1.75rem;
            height: 1.75rem;
            border-radius: 0.5625rem;
        }

        .wordmark {
            font-size: 0.875rem;
            font-weight: 600;
            letter-spacing: -0.025em;
        }

        main {
            margin: 0 auto;
            width: 100%;
            max-width: 80rem;
            flex: 1;
            padding: 2rem 1rem;
        }

        h1 {
            margin: 0;
            font-size: 1.875rem;
            font-weight: 500;
            letter-spacing: -0.025em;
            line-height: 1.2;
        }

        main p {
            margin: 0.5rem 0 0;
            font-size: 0.875rem;
            color: var(--muted-foreground);
        }

        .rise {
            animation: rise 0.35s cubic-bezier(0.16, 0.84, 0.32, 1) backwards;
        }

        @media (min-width: 768px) {
            main {
                padding: 2.5rem 1.5rem;
            }

            h1 {
                font-size: 2.25rem;
            }
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .rise {
                animation: none;
            }
        }
    </style>
</head>
