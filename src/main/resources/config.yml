server:
  bind-address: 0.0.0.0
  port: 27192
  # Logging. High-volume assets are omitted and rate-limit events are aggregated.
  logging:
    file: true              # write to <data-folder>/httpd.log
    file-path: "httpd.log"  # relative to the module's data folder
    console: false          # also mirror to the Bukkit console
    max-bytes: 10485760     # rotate after 10 MiB
    retained-files: 5       # keep httpd.log.1 through httpd.log.5
    flush-interval-ms: 1000 # batch disk flushes rather than flushing every request

  # Jetty thread pool. Bounded so a flood of HTTP requests can't starve the
  # Minecraft tick thread or consume unbounded memory.
  threads:
    max: 16
    min: 2
    idle-timeout-ms: 30000

  # Per-connection limits that close slow/abusive clients quickly.
  limits:
    idle-timeout-ms: 15000      # drop conns with no progress for this long
    accept-queue: 32            # OS-level backlog of pending TCP connects
    max-connections: 256        # bound live Jetty connections and their buffers
    request-header-bytes: 8192  # cap header size; oversized requests get 431
    schematic-download-bytes: 26214400 # reject downloads over 25 MiB
    schematic-download-concurrency: 4  # preserve Jetty workers during slow downloads

  # Server-Sent Events stream for the live dashboard. One connection per
  # open dashboard tab; the broadcaster pushes a stats frame on a fixed cadence
  # so the page never has to poll. Bounded so a flood of dashboards can't
  # exhaust Jetty's thread pool.
  sse:
    max-connections: 32           # reject further connects with 503 once reached
    broadcast-interval-ms: 2000   # keep below limits.idle-timeout-ms
    stats-sample-interval-ticks: 100 # expensive world/entity metrics every 5 seconds
    threads: 2                    # dedicated executor; isolates from Minecraft tick thread

# Token-bucket rate limiting. Defaults are sized for a small sized server.
# capacity = burst, per-second = sustained rate. Disable globally with enabled: false.
rate-limit:
  enabled: true
  global:
    capacity: 200
    per-second: 100
  per-ip:
    capacity: 30
    per-second: 10
  # Separate high-burst budget for frontend and inventory assets.
  assets:
    global:
      capacity: 2000
      per-second: 1000
    per-ip:
      capacity: 300
      per-second: 100
  # Expensive routes spend multiple tokens so a bot cannot run them at the same
  # rate as a cheap in-memory API request.
  costs:
    oauth-login: 10
    oauth-callback: 10
    schematic-list: 10
    schematic-download: 5
    punishments: 5
    stream-connect: 10
    player-list: 5
    staff-read: 5
    staff-mutation: 10

authentication:
  enabled: false

  provider:
    # Absolute URL the XenForo authorize page will redirect back to.
    # Must match the redirect URI registered on the OAuth2 client in XenForo.
    redirectUri: "https://example.com/oauth2/callback"
    xenforo:
      # XenForo site domain (no scheme, no trailing slash). The /oauth2/authorize,
      # /api/oauth2/token, /api/oauth2/revoke, and /api/me paths are derived from it.
      domain: "totalfreedom.tf"
      clientId: ""
      clientSecret: ""
      # How long a successful login stays valid, in minutes.
      sessionMinutes: 1440
      # Bound anonymous login state and blocking calls to XenForo so an outage
      # cannot consume the whole Jetty worker pool.
      maxPendingLogins: 2048
      maxActiveSessions: 4096
      maxConcurrentExchanges: 4
