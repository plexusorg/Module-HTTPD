<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Plex HTTPD</title>
    <link rel="icon" type="image/webp" href="/src/lib/assets/plexlogo.webp"/>
    <script>
        try {
            const theme = localStorage.getItem('plex-httpd-theme');
            if (theme ? theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark');
        } catch {
        }
    </script>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
